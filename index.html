<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACO Pilot Estimator</title>
  <meta name="description" content="Independent prototype: Medicare ACO baseline from CMS data, a pilot plan for two-way SMS care, and the range of outcomes at scale.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="title-row">
        <h1>SMS care program estimator for Medicare ACOs</h1>
        <div class="header-actions no-print">
          <button type="button" class="btn" id="copy-link">Copy link</button>
          <button type="button" class="btn" id="print">Print</button>
          <button type="button" class="btn btn-quiet" id="reset">Reset</button>
        </div>
      </div>
      <div class="picker no-print">
        <label for="aco-search" class="picker-label">ACOs</label>
        <div class="combo" id="combo">
          <input id="aco-search" type="text" role="combobox" aria-expanded="false" aria-controls="aco-options" aria-autocomplete="list" autocomplete="off" placeholder="Type an ACO name, ID, or state">
          <ul id="aco-options" class="combo-list" role="listbox" aria-multiselectable="true" hidden></ul>
        </div>
        <div class="chips" id="chips"></div>
      </div>
      <p class="print-meta" id="print-meta"></p>
    </div>
  </header>

  <main class="wrap">
    <section aria-labelledby="observed-heading">
      <div class="section-head">
        <h2 id="observed-heading">CMS data</h2>
        <span id="observed-source"></span>
      </div>
      <div id="observed-notice"></div>
      <div class="tiles" id="tiles"></div>
      <details class="card aco-table-card no-print" id="aco-table-card" hidden>
        <summary id="aco-table-summary"></summary>
        <div class="table-scroll"><table class="data-table" id="aco-table"></table></div>
      </details>
    </section>

    <div class="layout">
      <aside class="inputs-panel no-print" aria-label="Inputs">
        <form id="inputs" novalidate></form>
      </aside>

      <div class="bet" aria-live="polite">
        <section class="card" aria-labelledby="pilot-heading">
          <h2 class="card-heading" id="pilot-heading">Pilot</h2>
          <div class="stats" id="pilot-stats"></div>
          <h3 class="sub-heading">What the pilot can prove</h3>
          <div class="table-scroll"><table class="data-table scorecard" id="scorecard"></table></div>
        </section>

        <section class="card" aria-labelledby="scale-heading">
          <h2 class="card-heading" id="scale-heading">At scale, per year</h2>
          <div class="dist-row">
            <figure class="dist" id="dist"></figure>
            <div class="dist-side" id="dist-side"></div>
          </div>
          <div class="stats" id="scale-stats"></div>
        </section>

        <details class="card how no-print">
          <summary>How this is calculated</summary>
          <h3 class="sub-heading">Math (central case)</h3>
          <div id="math"></div>
          <h3 class="sub-heading">Assumptions</h3>
          <div class="table-scroll"><table class="data-table assumptions" id="assumptions"></table></div>
          <h3 class="sub-heading">CMS data used</h3>
          <div class="table-scroll"><table class="data-table assumptions" id="provenance"></table></div>
          <h3 class="sub-heading">Limits</h3>
          <ul class="limits" id="caveats"></ul>
        </details>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap" id="footer"></div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
